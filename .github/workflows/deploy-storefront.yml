# Deploys the shop to Vercel on every push to main that touches the storefront.
# Works with any Vercel account: it uses a token instead of Vercel's GitHub app.
# Needs three repository secrets (GitHub → Settings → Secrets and variables → Actions):
#   VERCEL_TOKEN       Vercel → Account Settings → Tokens → Create
#   VERCEL_ORG_ID      Vercel → Team (or Account) Settings → General → Team ID
#   VERCEL_PROJECT_ID  Vercel → the project → Settings → General → Project ID
# If the Vercel variables are marked Sensitive, also add NEXT_PUBLIC_MEDUSA_BACKEND_URL,
# NEXT_PUBLIC_MEDUSA_PUBLISHABLE_KEY and NEXT_PUBLIC_SITE_URL as GitHub secrets (same names).
name: Deploy shop to Vercel

on:
  push:
    branches: [main]
    paths:
      - "storefront/**"
      - ".github/workflows/deploy-storefront.yml"
  workflow_dispatch: # "Run workflow" button for a manual redeploy

concurrency:
  group: vercel-production
  cancel-in-progress: true

env:
  VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
  VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Check the secrets are set
        run: |
          for s in VERCEL_TOKEN VERCEL_ORG_ID VERCEL_PROJECT_ID; do
            if [ -z "${!s}" ]; then echo "::error::Missing repository secret $s (see the top of this file)"; exit 1; fi
          done
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}

      - name: Install the Vercel CLI
        run: npm install --global vercel@latest

      # Runs from the repo root: Vercel already knows the project lives in storefront/ (Root Directory setting)
      - name: Fetch project settings and environment variables
        run: vercel pull --yes --environment=production --token=${{ secrets.VERCEL_TOKEN }}

      # Vercel never hands "Sensitive" variables to outside builds, so they arrive empty.
      # Any of these set as GitHub secrets fill the gap.
      - name: Fill in the shop's settings
        env:
          SITE_URL: ${{ secrets.NEXT_PUBLIC_SITE_URL }}
          BACKEND_URL: ${{ secrets.NEXT_PUBLIC_MEDUSA_BACKEND_URL }}
          PUB_KEY: ${{ secrets.NEXT_PUBLIC_MEDUSA_PUBLISHABLE_KEY }}
          STRIPE_KEY: ${{ secrets.NEXT_PUBLIC_STRIPE_KEY }}
        run: |
          f=.vercel/.env.production.local
          touch "$f"
          set_var() { if [ -n "$2" ]; then grep -v "^$1=" "$f" > "$f.tmp" || true; mv "$f.tmp" "$f"; echo "$1=\"$2\"" >> "$f"; fi; }
          set_var NEXT_PUBLIC_SITE_URL "$SITE_URL"
          set_var NEXT_PUBLIC_MEDUSA_BACKEND_URL "$BACKEND_URL"
          set_var NEXT_PUBLIC_MEDUSA_PUBLISHABLE_KEY "$PUB_KEY"
          set_var NEXT_PUBLIC_STRIPE_KEY "$STRIPE_KEY"
          for v in NEXT_PUBLIC_MEDUSA_BACKEND_URL NEXT_PUBLIC_MEDUSA_PUBLISHABLE_KEY; do
            if ! grep -qE "^$v=\"?[^\"]+" "$f"; then
              echo "::error title=Missing $v::Vercel gave an empty $v (it is probably marked Sensitive). Add it as a GitHub secret with the same name, or re-add it in Vercel with Sensitive switched off."
              exit 1
            fi
          done

      - name: Build
        run: |
          set -o pipefail
          if ! vercel build --prod --token=${{ secrets.VERCEL_TOKEN }} 2>&1 | tee build.log; then
            # surface the end of the build log as annotations so it shows on the run page
            # GitHub keeps only 10 annotations per step, so send the tail as one message (newlines encoded)
            msg=$(tail -n 60 build.log | sed 's/%/%25/g' | awk '{printf "%s%%0A", $0}')
            echo "::error title=vercel build::$msg"
            exit 1
          fi

      - name: Deploy
        run: |
          url=$(vercel deploy --prebuilt --prod --token=${{ secrets.VERCEL_TOKEN }})
          echo "Live: $url" >> "$GITHUB_STEP_SUMMARY"
