# One-box deployment: database, cache, backend + admin, storefront, HTTPS.
# Set up by deploy/setup.sh (first time) and kept current by deploy/update.sh (every few minutes).
services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: gk
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: gk_medusa
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U gk -d gk_medusa"]
      interval: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    volumes: [redisdata:/data]

  backend:
    build:
      context: ../backend
      args:
        MEDUSA_BACKEND_URL: https://${ADMIN_DOMAIN}
    restart: unless-stopped
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_started }
    environment:
      DATABASE_URL: postgres://gk:${POSTGRES_PASSWORD}@postgres:5432/gk_medusa?sslmode=disable
      REDIS_URL: redis://redis:6379
      STORE_CORS: https://${SITE_DOMAIN}
      ADMIN_CORS: https://${ADMIN_DOMAIN}
      AUTH_CORS: https://${ADMIN_DOMAIN},https://${SITE_DOMAIN}
      JWT_SECRET: ${JWT_SECRET}
      COOKIE_SECRET: ${COOKIE_SECRET}
      AUTH_MFA_ENCRYPTION_KEY: ${AUTH_MFA_ENCRYPTION_KEY}
      MEDUSA_BACKEND_URL: https://${ADMIN_DOMAIN}
      STRIPE_API_KEY: ${STRIPE_API_KEY}
      STRIPE_WEBHOOK_SECRET: ${STRIPE_WEBHOOK_SECRET}
      # "pay later" test orders — keep false on the live shop
      ALLOW_TEST_ORDERS: ${ALLOW_TEST_ORDERS:-false}
      PAYPAL_CLIENT_ID: ${PAYPAL_CLIENT_ID:-}
      PAYPAL_CLIENT_SECRET: ${PAYPAL_CLIENT_SECRET:-}
      PAYPAL_MODE: ${PAYPAL_MODE:-sandbox}
      # prelaunch = checkout closed except for testers with the preview key; live = open. Switch with deploy/shop.sh
      SHOP_MODE: ${SHOP_MODE:-prelaunch}
      PREVIEW_KEY: ${PREVIEW_KEY:-}
      ADMIN_EMAIL: ${ADMIN_EMAIL:-}
      # emails (Resend) — order confirmation, dispatch, password reset, owner alerts
      RESEND_API_KEY: ${RESEND_API_KEY:-}
      EMAIL_FROM: ${EMAIL_FROM:-GK Parfum <sales@${SITE_DOMAIN}>}
      OWNER_EMAIL: ${OWNER_EMAIL:-${ADMIN_EMAIL:-}}
      STOREFRONT_URL: https://${SITE_DOMAIN}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-}
      # this server has room to spare, unlike the 512 MB free tier
      NODE_OPTIONS: --max-old-space-size=1024
    volumes: [uploads:/app/static]
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:9000/health >/dev/null || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 120s

  storefront:
    build:
      context: ../storefront
      args:
        NEXT_PUBLIC_MEDUSA_BACKEND_URL: https://${ADMIN_DOMAIN}
        NEXT_PUBLIC_MEDUSA_PUBLISHABLE_KEY: ${MEDUSA_PUBLISHABLE_KEY}
        NEXT_PUBLIC_SITE_URL: https://${SITE_DOMAIN}
        NEXT_PUBLIC_STRIPE_KEY: ${STRIPE_PUBLISHABLE_KEY}
        NEXT_PUBLIC_ALLOW_TEST_ORDERS: ${ALLOW_TEST_ORDERS:-false}
        NEXT_PUBLIC_PAYPAL_CLIENT_ID: ${PAYPAL_CLIENT_ID:-}
        NEXT_PUBLIC_SHOP_MODE: ${SHOP_MODE:-prelaunch}
    restart: unless-stopped
    depends_on:
      backend: { condition: service_healthy }
    environment:
      # server-side fetches go straight to the backend container
      MEDUSA_BACKEND_URL: http://backend:9000

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports: ["80:80", "443:443"]
    environment:
      SITE_DOMAIN: ${SITE_DOMAIN}
      ADMIN_DOMAIN: ${ADMIN_DOMAIN}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddydata:/data

volumes:
  pgdata:
  redisdata:
  uploads:
  caddydata:
